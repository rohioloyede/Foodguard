steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - -f
      - backend/Dockerfile
      - backend
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=^@^SUPABASE_URL=${_SUPABASE_URL}@SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}@GEMINI_MODEL=${_GEMINI_MODEL}@ALLOWED_ORIGINS=${_WEB_ORIGIN},capacitor://localhost,https://localhost
      - --set-secrets=SUPABASE_SERVICE_ROLE_KEY=foodguard-supabase-service-role:latest,GEMINI_API_KEY=foodguard-gemini-api-key:latest
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
substitutions:
  _REGION: us-central1
  _REPOSITORY: foodguard
  _SERVICE: foodguard-gemini-analysis
  _SUPABASE_URL: https://your-project.supabase.co
  _SUPABASE_ANON_KEY: replace-me
  _GEMINI_MODEL: gemini-2.5-flash
  _WEB_ORIGIN: https://your-foodguard-domain.example
options:
  logging: CLOUD_LOGGING_ONLY
